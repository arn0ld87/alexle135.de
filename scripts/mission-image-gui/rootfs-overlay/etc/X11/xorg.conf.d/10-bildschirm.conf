# Bildschirm im v86-Gast: Bochs-VGA über KMS (bochs-drm), PS/2-Tastatur und -Maus über
# evdev. Kein udev im Gast, deshalb feste Geräte; die Links legt /etc/local.d/bildschirm.start an.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

# Ohne GLX lädt Xorg weder Mesa noch LLVM (spart Download und RAM).
Section "Module"
    Disable "glx"
EndSection

Section "Device"
    Identifier "v86-vga"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "none"
    Option "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier "v86-screen"
    Device "v86-vga"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x768"
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "v86-tastatur"
    Driver "evdev"
    Option "Device" "/dev/input/v86-tastatur"
    Option "XkbLayout" "de"
    Option "XkbModel" "pc105"
EndSection

Section "InputDevice"
    Identifier "v86-maus"
    Driver "evdev"
    Option "Device" "/dev/input/v86-maus"
EndSection

Section "InputDevice"
    Identifier "v86-maus-rel"
    Driver "evdev"
    Option "Device" "/dev/input/v86-maus-rel"
EndSection

Section "ServerLayout"
    Identifier "v86"
    Screen "v86-screen"
    InputDevice "v86-tastatur" "CoreKeyboard"
    InputDevice "v86-maus" "CorePointer"
    InputDevice "v86-maus-rel" "SendCoreEvents"
EndSection
