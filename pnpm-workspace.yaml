packages:
  - .

allowBuilds:
  esbuild: true
  sharp: true

overrides:
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'
  'esbuild@>=0.27.3 <0.28.1': '0.28.1'
  'yaml@>=2.0.0 <2.8.3': '2.8.3'
  'sharp@<0.35.5': '0.35.5'
  'svgo@>=4.0.0 <4.1.0': '4.1.0'
  'fast-uri@>=3.0.0 <3.1.8': '3.1.8'
  'fast-xml-parser@>=5.9.3 <5.10.1': '5.10.1'
  'postcss@<=8.5.17': '8.5.26'
  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.12'
  'nanoid@>=3.0.0 <3.3.18': '3.3.20'
  'browserslist@<=4.28.6': '4.29.3'
  'smol-toml@<=1.8.0': '1.9.1'
  'devalue@<=5.9.2': '5.9.4'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'joi@>=17.0.0 <17.13.8': '17.13.8'
  'zod@>=4.0.0 <4.6.6': '4.6.7'
  'undici@>=8.0.0 <8.12.2': '8.12.3'

onlyBuiltDependencies:
  - esbuild
  - sharp

# Bewusste Audit-Ausnahmen: nur Advisories ohne gepatchte Version (Stand 2026-10-13).
# Bei jedem Dependency-PR prüfen, ob ein Patch erschienen ist, und den Eintrag dann entfernen.
auditConfig:
  ignoreGhsas:
    # http-cache-semantics <=4.2.0 (via astro), kein Patch verfügbar
    - GHSA-ch52-4w7c-c8xp
    # braces <=3.0.3 (via eslint-plugin-astro, nur Dev-Tooling), kein Patch verfügbar
    - GHSA-vfj7-8cjw-p6xm

# Keine Paketversionen auflösen, die jünger als 2 Tage sind (Minuten).
# Entspricht dem StepSecurity-Cooldown-Check und schützt vor frisch kompromittierten Releases.
minimumReleaseAge: 2880
