<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-radar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0f172a" />

  <!-- Abstract Shapes -->
  <circle cx="1200" cy="100" r="450" fill="url(#grad-radar)" opacity="0.15" />
  <circle cx="80" cy="620" r="400" fill="url(#grad-radar)" opacity="0.1" />

  <!-- Glass Card -->
  <rect x="240" y="160" width="800" height="400" rx="24" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Radar/Tracker Icon -->
  <g transform="translate(640, 260)" fill="none" stroke="url(#grad-radar)" stroke-width="2">
    <!-- Radar circles -->
    <circle cx="0" cy="0" r="60" opacity="0.3" />
    <circle cx="0" cy="0" r="40" opacity="0.5" />
    <circle cx="0" cy="0" r="20" opacity="0.7" />

    <!-- Radar sweep -->
    <path d="M0 0 L40 -46" stroke="url(#grad-radar)" stroke-width="3" />

    <!-- Progress dots (completed topics) -->
    <circle cx="30" cy="-35" r="5" fill="url(#grad-radar)" />
    <circle cx="-25" cy="20" r="5" fill="url(#grad-radar)" />
    <circle cx="45" cy="15" r="5" fill="url(#grad-radar)" />
    <circle cx="-10" cy="-45" r="5" fill="url(#grad-radar)" />
    <circle cx="15" cy="40" r="4" fill="url(#grad-radar)" opacity="0.6" />

    <!-- Center point -->
    <circle cx="0" cy="0" r="4" fill="url(#grad-radar)" />
  </g>

  <!-- Content -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="640" y="400" fill="white" font-size="56" font-weight="800" style="text-shadow: 0 4px 12px rgba(0,0,0,0.5)">IHK Radar</text>

    <!-- Subtitle -->
    <text x="640" y="460" fill="rgba(255,255,255,0.8)" font-size="28" font-weight="400" letter-spacing="1">FISI-Prüfungstracker</text>
  </g>

  <!-- Decorative Elements -->
  <path d="M240 160 L1040 160" stroke="url(#grad-radar)" stroke-width="2" opacity="0.5" />
  <path d="M240 560 L1040 560" stroke="url(#grad-radar)" stroke-width="2" opacity="0.5" />

</svg>
