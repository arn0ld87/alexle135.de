<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-roi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0f172a" />

  <!-- Abstract Shapes -->
  <circle cx="1200" cy="100" r="450" fill="url(#grad-roi)" opacity="0.15" />
  <circle cx="80" cy="620" r="400" fill="url(#grad-roi)" opacity="0.1" />

  <!-- Glass Card -->
  <rect x="240" y="160" width="800" height="400" rx="24" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Calculator/Chart Icon -->
  <g transform="translate(640, 260)" fill="none" stroke="url(#grad-roi)" stroke-width="2.5">
    <!-- Calculator outline -->
    <rect x="-50" y="-60" width="100" height="130" rx="8" />

    <!-- Display -->
    <rect x="-40" y="-50" width="80" height="25" rx="4" fill="url(#grad-roi)" opacity="0.3" />

    <!-- Chart bars inside -->
    <rect x="-30" y="10" width="12" height="40" rx="2" fill="url(#grad-roi)" opacity="0.6" />
    <rect x="-6" y="-5" width="12" height="55" rx="2" fill="url(#grad-roi)" opacity="0.8" />
    <rect x="18" y="-20" width="12" height="70" rx="2" fill="url(#grad-roi)" />

    <!-- Trend arrow -->
    <path d="M-35 25 L-10 0 L20 -30" stroke="white" stroke-width="2" opacity="0.8" />
    <path d="M10 -30 L20 -30 L20 -20" stroke="white" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Content -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="640" y="400" fill="white" font-size="56" font-weight="800" style="text-shadow: 0 4px 12px rgba(0,0,0,0.5)">ROI-Rechner</text>

    <!-- Subtitle -->
    <text x="640" y="460" fill="rgba(255,255,255,0.8)" font-size="28" font-weight="400" letter-spacing="1">Lohnt sich Automatisierung?</text>
  </g>

  <!-- Decorative Elements -->
  <path d="M240 160 L1040 160" stroke="url(#grad-roi)" stroke-width="2" opacity="0.5" />
  <path d="M240 560 L1040 560" stroke="url(#grad-roi)" stroke-width="2" opacity="0.5" />

</svg>
