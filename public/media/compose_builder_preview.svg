<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-builder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0f172a" />

  <!-- Abstract Shapes -->
  <circle cx="1200" cy="100" r="450" fill="url(#grad-builder)" opacity="0.15" />
  <circle cx="80" cy="620" r="400" fill="url(#grad-builder)" opacity="0.1" />

  <!-- Glass Card -->
  <rect x="240" y="160" width="800" height="400" rx="24" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Builder Icon - Stack with checkboxes -->
  <g transform="translate(640, 260)" fill="none" stroke="url(#grad-builder)" stroke-width="2.5">
    <!-- Container blocks -->
    <rect x="-60" y="-60" width="120" height="35" rx="6" />
    <rect x="-60" y="-15" width="120" height="35" rx="6" />
    <rect x="-60" y="30" width="120" height="35" rx="6" />

    <!-- Checkboxes -->
    <rect x="-50" y="-50" width="14" height="14" rx="2" fill="url(#grad-builder)" />
    <rect x="-50" y="-5" width="14" height="14" rx="2" fill="url(#grad-builder)" />
    <rect x="-50" y="40" width="14" height="14" rx="2" />

    <!-- Check marks -->
    <path d="M-47 -43 L-44 -40 L-39 -47" stroke="white" stroke-width="2" fill="none" />
    <path d="M-47 2 L-44 5 L-39 -2" stroke="white" stroke-width="2" fill="none" />
  </g>

  <!-- Content -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="640" y="400" fill="white" font-size="52" font-weight="800" style="text-shadow: 0 4px 12px rgba(0,0,0,0.5)">Docker Compose Builder</text>

    <!-- Subtitle -->
    <text x="640" y="460" fill="rgba(255,255,255,0.8)" font-size="28" font-weight="400" letter-spacing="1">Stacks zusammenklicken</text>
  </g>

  <!-- Decorative Elements -->
  <path d="M240 160 L1040 160" stroke="url(#grad-builder)" stroke-width="2" opacity="0.5" />
  <path d="M240 560 L1040 560" stroke="url(#grad-builder)" stroke-width="2" opacity="0.5" />

</svg>
