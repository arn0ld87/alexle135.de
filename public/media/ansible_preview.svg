<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-ansible" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0f172a" />

  <!-- Abstract Shapes -->
  <circle cx="200" cy="150" r="400" fill="url(#grad-ansible)" opacity="0.15" />
  <circle cx="1100" cy="600" r="450" fill="url(#grad-ansible)" opacity="0.1" />

  <!-- Glass Card -->
  <rect x="240" y="160" width="800" height="400" rx="24" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Ansible "A" Icon / Automation Symbol -->
  <g transform="translate(640, 270)" fill="none" stroke="url(#grad-ansible)" stroke-width="2.5">
    <!-- Central node -->
    <circle cx="0" cy="0" r="15" fill="url(#grad-ansible)" opacity="0.3" />
    <!-- Connected nodes -->
    <circle cx="-50" cy="-40" r="8" />
    <circle cx="50" cy="-40" r="8" />
    <circle cx="-50" cy="40" r="8" />
    <circle cx="50" cy="40" r="8" />
    <!-- Connection lines -->
    <path d="M-42 -35 L-8 -5" />
    <path d="M42 -35 L8 -5" />
    <path d="M-42 35 L-8 5" />
    <path d="M42 35 L8 5" />
    <!-- Arrows indicating automation flow -->
    <path d="M-50 -30 L-50 -20" stroke-width="2" />
    <path d="M50 20 L50 30" stroke-width="2" />
  </g>

  <!-- Content -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <!-- Title -->
    <text x="640" y="400" fill="white" font-size="56" font-weight="800" style="text-shadow: 0 4px 12px rgba(0,0,0,0.5)">Server-Automatisierung</text>

    <!-- Subtitle -->
    <text x="640" y="460" fill="rgba(255,255,255,0.8)" font-size="32" font-weight="400" letter-spacing="1">mit Ansible</text>
  </g>

  <!-- Decorative Elements -->
  <path d="M240 160 L1040 160" stroke="url(#grad-ansible)" stroke-width="2" opacity="0.5" />
  <path d="M240 560 L1040 560" stroke="url(#grad-ansible)" stroke-width="2" opacity="0.5" />

</svg>