version: '3.9'

services:
  db:
    image: postgres:18
    container_name: alexle135-db
    restart: unless-stopped
    environment:
      # Werte kommen ausschließlich aus der Server-.env (Vaultwarden).
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB muss gesetzt sein}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER muss gesetzt sein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      # postgres:18-Layout: Mount auf das Parent-Verzeichnis; das Image legt
      # die Daten versioniert unter /var/lib/postgresql/18/docker ab und
      # verweigert den Start bei einem Legacy-Mount auf .../data.
      - alexle135-db-data:/var/lib/postgresql
    networks:
      - app_internal
    # Kein ports:-Mapping: PostgreSQL bleibt ausschließlich im internen App-Netz.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  alexle135-v2:
    # Fertiges Image aus ghcr.io, gebaut vom Job `image` in deploy.yml; der
    # Server baut nicht mehr. Immutable Tag pro Deploy (#289): deploy.yml setzt
    # DEPLOY_SHA auf den kurzen Commit-SHA (<sha12>). Rollback: rollback.sh
    # setzt DEPLOY_SHA=last-healthy (lokaler Tag, nie gepusht) bzw. einen
    # älteren SHA-Tag. Ohne DEPLOY_SHA gilt "latest".
    image: ghcr.io/arn0ld87/alexle-vsco:${DEPLOY_SHA:-latest}
    # Nur ziehen, wenn der Tag lokal fehlt: deploy.yml zieht explizit vorher,
    # last-healthy existiert nur lokal.
    pull_policy: missing
    container_name: alexle135-v2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Admin-Allowlist für den fail-closed Check in src/lib/adminAuth.ts (#143).
      # env.ts liest ADMIN_EMAILS zur Runtime aus process.env — ohne diese
      # Durchreichung bleibt die Allowlist leer und der Owner sperrt sich aus.
      # Wert kommt aus der Server-.env via compose-Substitution.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Runtime-Secrets: bleiben aus dem Client-Bundle heraus.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL muss gesetzt sein}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET muss gesetzt sein}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://alex-schneider.dev}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY muss gesetzt sein}
      CONTACT_IP_SALT: ${CONTACT_IP_SALT:-}
      # Traefik ist hier GARANTIERT der einzige Hop vor diesem Container (kein
      # zusätzlicher CDN/Proxy davor) — deshalb darf src/lib/rateLimit.ts dem
      # letzten (rightmost) X-Forwarded-For-Eintrag vertrauen, den Traefik beim
      # Weiterleiten anhängt (Default-Verhalten, solange Traefiks
      # entryPoints.*.forwardedHeaders.notAppendXForwardedFor nicht gesetzt
      # ist — hier nicht der Fall, siehe docs/architecture.md). NIE auf "true"
      # setzen, wenn dieser Container direkt erreichbar wäre (#261).
      TRUST_PROXY: 'true'
    networks:
      - proxy
      - app_internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      # Canonical router: alex-schneider.dev ist die neue Primär-Domain; alexle135.de
      # bleibt im Übergang bis zum Cloudflare-301 (Phase 3) am selben Service.
      - 'traefik.http.routers.alexle135.rule=Host(`alex-schneider.dev`) || Host(`alexle135.de`)'
      - 'traefik.http.routers.alexle135.entrypoints=websecure'
      - 'traefik.http.routers.alexle135.tls.certresolver=letsencrypt'
      - 'traefik.http.services.alexle135.loadbalancer.server.port=3000'
      # www → non-www 301 redirect (fixes duplicate-content risk); beide www-Hosts
      # leiten auf die neue Primär-Domain alex-schneider.dev um.
      - 'traefik.http.routers.alexle135-www.rule=Host(`www.alex-schneider.dev`) || Host(`www.alexle135.de`)'
      - 'traefik.http.routers.alexle135-www.entrypoints=websecure'
      - 'traefik.http.routers.alexle135-www.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.alexle135-www.middlewares=alexle135-www-redirect@docker'
      - 'traefik.http.routers.alexle135-www.service=alexle135'
      - 'traefik.http.middlewares.alexle135-www-redirect.redirectregex.regex=^https?://www\.(alex-schneider\.dev|alexle135\.de)/(.*)'
      - 'traefik.http.middlewares.alexle135-www-redirect.redirectregex.replacement=https://alex-schneider.dev/$${2}'
      - 'traefik.http.middlewares.alexle135-www-redirect.redirectregex.permanent=true'
      # ── CSP-Strategie (gespiegelt aus astro.config.mjs — beide synchron halten) ──
      # Default-Policy (alle Routen): strikt, OHNE unsafe-eval/wasm-unsafe-eval, OHNE
      # COEP/COOP. unsafe-inline (script) bleibt, weil GoogleAnalytics.astro ein
      # define:vars-Inline-Script auf jeder Seite ist.
      # Missions-Policy (CSP_MISSIONS): Default plus wasm-unsafe-eval und worker-src blob:
      # für v86, nur für die zwei Terminal-app-Routen (eigener Router unten), ohne COEP/COOP.
      # Vor Änderungen IMMER csp-header-guard-Agent prüfen lassen. HARD-RULE: nach jeder
      # Änderung beide Terminal-Missionen manuell testen (v86 bootet sonst nicht).
      #
      # Default-Header-Middleware (strikte CSP, keine COEP/COOP)
      - "traefik.http.middlewares.alexle135-headers.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://platform.linkedin.com https://static.cloudflareinsights.com; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://platform.linkedin.com https://cloudflareinsights.com; frame-src 'self' https://platform.linkedin.com https://www.linkedin.com; worker-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; base-uri 'self'; frame-ancestors 'self'"
      - 'traefik.http.middlewares.alexle135-headers.headers.stsSeconds=63072000'
      - 'traefik.http.middlewares.alexle135-headers.headers.stsIncludeSubdomains=true'
      - 'traefik.http.middlewares.alexle135-headers.headers.stsPreload=true'
      - 'traefik.http.middlewares.alexle135-headers.headers.forceSTSHeader=true'
      - 'traefik.http.middlewares.alexle135-headers.headers.contentTypeNosniff=true'
      - 'traefik.http.middlewares.alexle135-headers.headers.referrerPolicy=strict-origin-when-cross-origin'
      - 'traefik.http.middlewares.alexle135-headers.headers.customFrameOptionsValue=SAMEORIGIN'
      - 'traefik.http.middlewares.alexle135-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=(), usb=()'
      # Missions-Header-Middleware (CSP_MISSIONS, keine COEP/COOP, nur Terminal-Routen).
      # Generische Schutzheader hier dupliziert, damit die Middleware self-contained ist.
      - "traefik.http.middlewares.alexle135-headers-missions.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://www.googletagmanager.com https://platform.linkedin.com https://static.cloudflareinsights.com; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://platform.linkedin.com https://cloudflareinsights.com; frame-src 'self' https://platform.linkedin.com https://www.linkedin.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; base-uri 'self'; frame-ancestors 'self'"
      - 'traefik.http.middlewares.alexle135-headers-missions.headers.stsSeconds=63072000'
      - 'traefik.http.middlewares.alexle135-headers-missions.headers.stsIncludeSubdomains=true'
      - 'traefik.http.middlewares.alexle135-headers-missions.headers.stsPreload=true'
      - 'traefik.http.middlewares.alexle135-headers-missions.headers.forceSTSHeader=true'
      - 'traefik.http.middlewares.alexle135-headers-missions.headers.contentTypeNosniff=true'
      - 'traefik.http.middlewares.alexle135-headers-missions.headers.referrerPolicy=strict-origin-when-cross-origin'
      - 'traefik.http.middlewares.alexle135-headers-missions.headers.customFrameOptionsValue=SAMEORIGIN'
      - 'traefik.http.middlewares.alexle135-headers-missions.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=(), usb=()'
      # Compression-Middleware (PERF-05): Traefik komprimiert HTTP-Antworten (gzip/brotli) für alle Clients
      - 'traefik.http.middlewares.alexle135-compress.compress=true'
      - 'traefik.http.routers.alexle135.middlewares=alexle135-compress@docker,alexle135-headers@docker'
      # Missions-Router: höhere Priority als der Default-Router (Host-only),
      # damit die zwei Terminal-app-Routen CSP_MISSIONS bekommen.
      # Segmentgenau wie isMissionRoute() in src/lib/security-headers.ts: Path() matcht exakt,
      # PathPrefix(`…/app/`) nur echte Unterpfade — Traefiks PathPrefix ohne Slash würde
      # auch Teilwort-Geschwister wie `…/app-foo` matchen (Issue #286).
      - 'traefik.http.routers.alexle135-missions.rule=(Host(`alex-schneider.dev`) || Host(`alexle135.de`)) && (Path(`/projekte/terminal-missionen/app`) || PathPrefix(`/projekte/terminal-missionen/app/`) || Path(`/projekte/windows-terminal-missionen/app`) || PathPrefix(`/projekte/windows-terminal-missionen/app/`))'
      - 'traefik.http.routers.alexle135-missions.priority=100'
      - 'traefik.http.routers.alexle135-missions.entrypoints=websecure'
      - 'traefik.http.routers.alexle135-missions.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.alexle135-missions.service=alexle135'
      - 'traefik.http.routers.alexle135-missions.middlewares=alexle135-compress@docker,alexle135-headers-missions@docker'

networks:
  proxy:
    external: true
  app_internal:
    internal: true

volumes:
  alexle135-db-data:
