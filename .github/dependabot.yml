# .github/dependabot.yml
# Repo: arn0ld87/alexle-vsco
# Fokus: Astro/React-Website + Docker-Deployment + GitHub Actions.

version: 2

updates:
  # Produktive Node/npm-Teile:
  # - /: Astro-Website alex-schneider.dev (inkl. Feld `packageManager` für pnpm)
  - package-ecosystem: 'npm'
    directories:
      - '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 6
    versioning-strategy: 'increase-if-necessary'
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'
    cooldown:
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 1
      exclude:
        - 'sanitize-html'
        - 'simple-oauth2'
        - '@supabase/supabase-js'
        - '@google/generative-ai'
        - 'express'
        - 'jsonwebtoken'
        - 'bcrypt'
        - 'multer'
    groups:
      astro-stack:
        applies-to: 'version-updates'
        patterns:
          - 'astro'
          - '@astrojs/*'
        update-types:
          - 'minor'
          - 'patch'

      react-ui-stack:
        applies-to: 'version-updates'
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - '@radix-ui/*'
          - 'lucide-*'
          - 'tailwind-merge'
          - 'class-variance-authority'
          - 'clsx'
        update-types:
          - 'minor'
          - 'patch'

      security-runtime:
        applies-to: 'version-updates'
        patterns:
          - 'sanitize-html'
          - 'simple-oauth2'
          - '@supabase/supabase-js'
          - '@google/generative-ai'
          - 'express'
          - 'jsonwebtoken'
          - 'bcrypt'
          - 'multer'
          - 'cors'
        update-types:
          - 'minor'
          - 'patch'

      build-test-tooling:
        applies-to: 'version-updates'
        dependency-type: 'development'
        patterns:
          - '@eslint/*'
          - 'eslint*'
          - 'prettier'
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - '@vitejs/*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'jsdom'
          - 'globals'
        update-types:
          - 'minor'
          - 'patch'

      transitive-security:
        applies-to: 'version-updates'
        patterns:
          - 'minimatch'
          - 'fast-xml-parser'
          - 'fast-xml-builder'
          - 'picomatch'
          - 'devalue'
          - 'flatted'
          - 'brace-expansion'
          - 'smol-toml'
          - 'yaml'
          - 'defu'
          - 'svgo'
          - 'h3'
          - 'rollup'
        update-types:
          - 'minor'
          - 'patch'

  # Docker-Basisimage für das produktive Deployment.
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '07:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 2
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps(docker)'
      include: 'scope'
    cooldown:
      default-days: 7
    ignore:
      # Node 22 bleibt hier bewusst stabil. Major-Wechsel auf Node 24 erst manuell testen,
      # weil Dockerfile + Production-Build direkt alex-schneider.dev betreffen.
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'

  # Actions im Deploy-Workflow: checkout, Tailscale usw.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '07:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 3
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: 'version-updates'
        patterns:
          - 'actions/*'
          - 'tailscale/*'
        update-types:
          - 'minor'
          - 'patch'
