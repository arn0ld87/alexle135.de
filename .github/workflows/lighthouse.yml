name: Lighthouse CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse-Budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        # Version stammt aus "packageManager" in package.json (Single Source of Truth).
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (SSR)
        run: pnpm build

      # Der SSR-Server läuft auf Port 4321 und wird im Hintergrund gestartet.
      # HOST=0.0.0.0 stellt sicher, dass Lighthouse den Loopback erreicht.
      - name: Start SSR-Server
        run: |
          HOST=0.0.0.0 PORT=4321 node ./dist/server/entry.mjs &
          echo "SSR_PID=$!" >> "$GITHUB_ENV"
          # Warten bis der Server antwortet (max. 30 s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4321/ -o /dev/null; then
              echo "Server bereit nach ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            http://localhost:4321/
            http://localhost:4321/blog/
            http://localhost:4321/projekte/
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop SSR-Server
        if: always()
        run: |
          if [ -n "${SSR_PID:-}" ]; then
            kill "$SSR_PID" 2>/dev/null || true
          fi
