name: Lighthouse CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse-Budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        # Version stammt aus "packageManager" in package.json (Single Source of Truth).
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (SSR)
        run: pnpm build

      # Der SSR-Server läuft auf Port 4321 und wird im Hintergrund gestartet.
      # HOST=0.0.0.0 stellt sicher, dass Lighthouse den Loopback erreicht.
      - name: Start SSR-Server
        run: |
          HOST=0.0.0.0 PORT=4321 node ./dist/server/entry.mjs &
          echo "SSR_PID=$!" >> "$GITHUB_ENV"
          # Warten bis der Server antwortet (max. 30 s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4321/ -o /dev/null; then
              echo "Server bereit nach ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: |
            http://localhost:4321/
            http://localhost:4321/blog/
            http://localhost:4321/projekte/
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop SSR-Server
        if: always()
        run: |
          if [ -n "${SSR_PID:-}" ]; then
            kill "$SSR_PID" 2>/dev/null || true
          fi
